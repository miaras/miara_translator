<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10212b">
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg?v=ami-white-outline">
    <title>Book photos — Shiroko Translator</title>
    <meta name="description" content="Import book photos, review page text, and translate your book.">
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js"></script>
</head>
<body class="workspace-page book-page">
    <header class="site-header light-header">
        <a class="wordmark" href="index.html" aria-label="Shiroko home"><span class="wordmark-symbol" aria-hidden="true"></span>shiroko<span class="wordmark-dot">.</span></a>
        <span class="header-caption">The translation studio</span>
        <div class="account-controls"><span id="account-email" hidden></span><button id="auth-open" class="header-link" type="button">Sign in</button><button id="billing-open" class="header-link" type="button" hidden>Add credit</button><button id="invite-open" class="header-link" type="button" hidden>Invite friends</button><button id="auth-methods" class="header-link" type="button" hidden>Sign-in methods</button><button id="sign-out" class="header-link" type="button" hidden>Sign out</button></div>
    </header>
    <main id="book-editor" class="book-editor" aria-labelledby="book-title"></main>
    <dialog id="auth-dialog" class="auth-dialog" aria-labelledby="auth-heading">
        <button id="auth-close" class="auth-close" type="button" aria-label="Close">Close</button>
        <h2 id="auth-heading">Welcome back.</h2>
        <p id="auth-intro">Sign in to keep your translations close.</p>
        <div id="social-providers" class="social-providers" aria-label="Social sign-in options"></div>
        <p id="social-status" class="social-status" role="status"></p>
        <p id="auth-error" class="form-error" role="alert"></p>
        <form id="auth-form">
            <p class="auth-divider">or use your email</p>
            <label for="auth-email">Email</label><input id="auth-email" type="email" autocomplete="email" required>
            <label for="auth-password">Password</label><input id="auth-password" type="password" autocomplete="current-password" required minlength="12">
            <div id="auth-promotion-field" hidden><label for="auth-promotion">Promotion code (optional)</label><input id="auth-promotion" type="text" autocomplete="off" maxlength="100"></div>
            <button id="auth-submit" class="button button-dark" type="submit">Sign in</button>
            <button id="auth-switch" class="auth-switch" type="button">New here? Create an account</button>
        </form>
    </dialog>
    <script type="module" src="script.js"></script>
    <script type="module" src="interface-i18n.js"></script>
    <script type="module" src="photo-upload.js"></script>
</body>
</html>
